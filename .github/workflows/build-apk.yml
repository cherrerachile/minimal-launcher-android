name: Build Minimal Launcher APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract original source and apply modern UI
        run: |
          unzip -q MinimalLauncher_v1_source.zip
          cp .github/overrides/MainActivity.kt MinimalLauncher/app/src/main/java/cl/minimal/launcher/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MinimalLauncher/app/build.gradle.kts')
          p.write_text(p.read_text().replace('versionCode = 1; versionName = "1.0"', 'versionCode = 4; versionName = "1.3"'))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: MinimalLauncher
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-v1.3-debug-apk
          path: MinimalLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
